          <section class="view" id="view-profile" aria-label="Profile">
            <h1 class="section-title" data-i18n="profile.title">Profil</h1>
            <div class="panel profile-panel">
              <div class="profile-hero">
                <span class="headshot headshot-lg">
                  <canvas data-headshot="96" width="96" height="96" aria-hidden="true"></canvas>
                  <span class="headshot-fallback" data-head-fallback="1"><span id="profileAvatar">?</span></span>
                </span>
                <span class="account-meta">
                  <span class="account-name" id="profileName">Not signed in</span>
                  <span class="account-state" id="profileState">Microsoft only</span>
                </span>
              </div>
              <div class="row profile-actions">
                <button type="button" class="btn btn-ghost btn-sm" id="profileRefreshButton">
                  <i data-lucide="refresh-cw" class="btn-icon"></i>
                  <span data-i18n="play.refresh">Session aktualisieren</span>
                </button>
                <button type="button" class="btn btn-ghost btn-sm" id="profileOutfitButton">
                  <i data-lucide="shirt" class="btn-icon"></i>
                  <span data-i18n="profile.outfit">Outfit öffnen</span>
                </button>
              </div>
              <button type="button" class="btn btn-ghost btn-block" id="authButton">
                <i data-lucide="log-in" class="btn-icon"></i>
                <span>Sign in</span>
              </button>
            </div>
          </section>

<section class="view" id="view-add-content" aria-label="Add content">
  <div class="row">
    <button type="button" class="btn btn-ghost btn-sm" id="detailAddBackButton">
      <i data-lucide="arrow-left" class="btn-icon"></i>
      <span data-i18n="crumb.instance-detail">Instanz</span>
    </button>
  </div>
  <div class="panel">
    <div class="panel-head">
      <h3 class="panel-title">
        <i data-lucide="plus-circle" class="panel-icon"></i>
        <span id="detailSearchTitle" data-i18n="addContent.title">Add content</span>
      </h3>
    </div>
    <div class="toolbar">
      <div class="search-box">
        <i data-lucide="search" class="search-icon"></i>
        <input
          type="search"
          id="detailSearchInput"
          class="input"
          placeholder="Search Modrinth — type to search"
          data-i18n-ph="detail.searchPh"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </div>
    <p class="status-line" id="detailSearchStatus" data-i18n="detail.searchHint">
      Type to search Modrinth for this instance.
    </p>
    <div class="segment" role="group" aria-label="Content type" id="detailTabs">
      <button type="button" class="segment-btn is-active" data-category="all" data-i18n="detail.fAll">All</button>
      <button type="button" class="segment-btn" data-category="mod" data-i18n="detail.gMods">Mods</button>
      <button type="button" class="segment-btn" data-category="resourcepack" data-i18n="detail.gRp">
        Resource Packs
      </button>
      <button type="button" class="segment-btn" data-category="shader" data-i18n="detail.gShaders">Shaders</button>
    </div>
    <div class="dropzone" id="detailDropZone">
      <i data-lucide="file-plus-2" class="dropzone-icon"></i>
      <span id="detailDropZoneText">Drop .jar files here to add them to this instance</span>
      <span class="dropzone-or" data-i18n="detail.or">or</span>
      <button type="button" class="btn btn-primary btn-sm" id="detailUploadButton">
        <i data-lucide="upload" class="btn-icon"></i>
        <span data-i18n="detail.uploadFiles">Upload files</span>
      </button>
    </div>
    <div class="mod-grid" id="detailResults"></div>
    <div id="detailSentinel" class="scroll-sentinel" aria-hidden="true"></div>
  </div>
</section>

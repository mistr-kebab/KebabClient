<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>KebabClient</title>
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/views.css">
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <span class="brand-mark splash-mark"></span>
    <span class="splash-name">KebabClient</span>
    <span class="splash-status" id="splashStatus">Loading…</span>
    <span class="splash-bar"><span class="splash-bar-fill"></span></span>
  </div>
  <div class="app" id="app">
    <aside class="rail" aria-label="Primary">
      <span class="brand-mark rail-logo" aria-hidden="true"></span>
      <nav class="nav" id="mainNav" aria-label="Sections">
        <button type="button" class="nav-item is-active" data-view="home" data-i18n-title="nav.home" title="Home">
          <i data-lucide="house" class="nav-icon"></i>
          <span class="rail-label" data-i18n="nav.home">Home</span>
        </button>
        <button type="button" class="nav-item" data-view="play" data-i18n-title="nav.play" title="Spielen">
          <i data-lucide="play" class="nav-icon"></i>
          <span class="rail-label" data-i18n="nav.play">Spielen</span>
        </button>
        <button type="button" class="nav-item" data-view="instances" data-i18n-title="nav.instances" title="Instanzen">
          <i data-lucide="layers" class="nav-icon"></i>
          <span class="rail-label" data-i18n="nav.instances">Instanzen</span>
        </button>
        <button type="button" class="nav-item" data-view="skins" data-i18n-title="nav.skins" title="Skins">
          <i data-lucide="shirt" class="nav-icon"></i>
          <span class="rail-label" data-i18n="nav.skins">Skins</span>
        </button>
        <button type="button" class="nav-item" data-view="servers" data-i18n-title="nav.servers" title="Server">
          <i data-lucide="server" class="nav-icon"></i>
          <span class="rail-label" data-i18n="nav.servers">Server</span>
        </button>
        <button type="button" class="nav-item" data-view="friends" data-i18n-title="nav.friends" title="Friends">
          <i data-lucide="users" class="nav-icon"></i>
          <span class="rail-label" data-i18n="nav.friends">Friends</span>
        </button>
      </nav>
      <div class="rail-foot">
        <nav class="nav nav-bottom" id="settingsNav" aria-label="Settings">
          <button type="button" class="nav-item" data-view="settings" data-i18n-title="nav.settings" title="Settings">
            <i data-lucide="settings" class="nav-icon"></i>
            <span class="rail-label" data-i18n="nav.settings">Settings</span>
          </button>
        </nav>
        <button type="button" class="rail-profile" id="railProfileButton" title="Profile" data-i18n-title="nav.profile" aria-label="Profile" data-i18n-aria="nav.profile">
          <span class="headshot headshot-md">
            <canvas data-headshot="72" width="72" height="72" aria-hidden="true"></canvas>
            <span class="headshot-fallback" data-head-fallback="1"><i data-lucide="log-in"></i></span>
          </span>
        </button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="crumb">
          <span class="crumb-brand">KebabClient</span>
          <i data-lucide="chevron-right" class="crumb-sep"></i>
          <span id="crumbView">Home</span>
        </div>
        <div class="topbar-right">
          <button type="button" class="btn btn-primary btn-sm update-btn" id="updateButton" hidden>
            <i data-lucide="arrow-down-to-line" class="btn-icon"></i>
            <span id="updateButtonLabel">Update</span>
          </button>
          <div class="window-controls" role="group" aria-label="Window">
            <button type="button" class="titlebar-btn" id="minButton" title="Minimize" aria-label="Minimize">
              <i data-lucide="minus"></i>
            </button>
            <button type="button" class="titlebar-btn" id="maxButton" title="Maximize" aria-label="Maximize">
              <i data-lucide="square" id="maxButtonIcon"></i>
            </button>
            <button type="button" class="titlebar-btn titlebar-close" id="closeButton" title="Close" aria-label="Close">
              <i data-lucide="x"></i>
            </button>
          </div>
        </div>
      </header>

      <div class="body-row">
        <main class="content"></main>
      </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="./assets/vendor/lucide.min.js"></script>
  <script src="./assets/vendor/skinview3d.bundle.js"></script>
  <script src="./scripts/views.js"></script>
  <script src="./scripts/bridge.js"></script>
  <script src="./scripts/util.js"></script>
  <script src="./scripts/toast.js"></script>
  <script src="./scripts/i18n.js"></script>
  <script src="./scripts/avatar.js"></script>
  <script src="./scripts/icons.js"></script>
  <script src="./scripts/app.js"></script>
  <script src="./scripts/auth.js"></script>
  <script src="./scripts/instance.js"></script>
  <script src="./scripts/skins.js"></script>
  <script src="./scripts/servers.js"></script>
  <script src="./scripts/instances/shared.js"></script>
  <script src="./scripts/instances/list.js"></script>
  <script src="./scripts/instances/create.js"></script>
  <script src="./scripts/instances/detail.js"></script>
  <script src="./scripts/instances/content.js"></script>
  <script src="./scripts/instances.js"></script>
  <script src="./scripts/home.js"></script>
  <script src="./scripts/updater.js"></script>
  <script src="./scripts/settings.js"></script>
  <script src="./scripts/about.js"></script>
  <script src="./scripts/ban.js"></script>
  <script src="./scripts/crash.js"></script>
</body>
</html>
